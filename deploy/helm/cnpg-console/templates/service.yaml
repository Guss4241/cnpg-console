apiVersion: v1
kind: Service
metadata:
  name: cnpg-console
  labels:
    {{- include "cnpg-console.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "cnpg-console.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
