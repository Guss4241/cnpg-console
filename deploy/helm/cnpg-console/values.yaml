image:
  repository: ghcr.io/OWNER/cnpg-console
  tag: ""            # défaut = .Chart.AppVersion
  pullPolicy: IfNotPresent

replicaCount: 1

# Config applicative (montée en ConfigMap sur /etc/cnpg-console/config.yaml).
# AUCUN secret ici — voir `secret` ci-dessous pour les variables sensibles.
config:
  server:
    addr: ":8080"
  auth:
    username: admin
    passwordEnv: CNPG_ADMIN_PASSWORD
  session:
    secretEnv: CNPG_SESSION_SECRET
  github:
    owner: Consoneo
    tokenEnv: CNPG_GITHUB_TOKEN
    infraRepo: helm-cnpg.tool
    infraBranch: master
    infraValuesPath: values-consoneotech.yaml
    teamRepoPrefix: pg-
  cnpg:
    hostnameSuffix: .pg.consoneo.tech
    portBase: 5432
  argocd:
    server: argo-cd.consoneo.tech
    tokenEnv: CNPG_ARGOCD_TOKEN
    insecure: false
    clustersApp: cnpg-clusters
    project: it-project
  kube:
    # Création assistée du Secret de mot de passe via kubectl (accès k8s local).
    # DÉSACTIVÉ en déploiement in-cluster : pas de kubeconfig multi-contexte et
    # aucun accès k8s en écriture accordé à l'app. L'UI retombe sur la commande
    # kubectl manuelle. À n'activer qu'en usage local-admin.
    enabled: false

# Secrets injectés en variables d'environnement. Recommandé : `existingSecret`
# (Vault / External Secrets). `create: true` + `data` = pratique en dev seulement.
secret:
  create: false
  existingSecret: cnpg-console-secrets
  data: {}   # ex. CNPG_ADMIN_PASSWORD, CNPG_SESSION_SECRET, CNPG_GITHUB_TOKEN, CNPG_ARGOCD_TOKEN

cookieSecure: true

service:
  port: 80

ingress:
  enabled: false
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: consoneo-tech
  host: cnpg-console.consoneo.tech
  tls: true

resources:
  requests:
    cpu: 25m
    memory: 48Mi
  limits:
    memory: 96Mi   # pas de limit CPU (convention Consoneo)

nodeSelector:
  env: prd
tolerations:
  - key: env
    operator: Equal
    value: prd
    effect: NoSchedule
